<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | CWU</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth-page"><div class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">CWU</span><span>Cyber World University</span></a><p class="eyebrow">STUDENT REGISTRATION</p><h1>Create your account</h1><form data-register-form><label>Full Name<input name="name" required minlength="2" placeholder="Your name"></label><label>Email<input name="email" type="email" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" minlength="8" required placeholder="Create a password"></label><button class="btn" type="submit">Register</button></form><p>Already registered? <a class="text-link" href="login.html">Login</a></p><p class="demo-note">Production API: account data is stored server-side when the database environment is configured.</p></div></main><script src="js/auth.js"></script></body></html>
