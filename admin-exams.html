<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final Exam Builder | CWU</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="admin.html"><span class="brand-mark">CWU</span><span>Final Exam Builder</span></a><nav><a href="admin.html">Admin</a><a href="admin-questions.html">Question Bank</a><a href="admin-quizzes.html">Quizzes</a><a href="admin-courses.html">Courses</a></nav><button class="btn btn-small" data-logout>Logout</button></header><main><section class="section admin-shell"><div class="section-heading"><p class="eyebrow">ADMIN · EXAMINATIONS</p><h1>Final Exam Builder</h1><p class="hero-text">Configure final examinations from each course question bank.</p></div><div class="form-message" data-message hidden></div><form class="course-card admin-form" data-form><label>Course<select name="courseId" data-course required></select></label><label>Exam title<input name="title" required maxlength="160" placeholder="Final Examination"></label><label>Description<textarea name="description" rows="3" maxlength="1000"></textarea></label><div class="form-grid"><label>Questions<input name="questionCount" type="number" min="1" value="20" required></label><label>Time limit (minutes)<input name="timeLimitMinutes" type="number" min="1" value="30" required></label><label>Pass percentage<input name="passPercent" type="number" min="1" max="100" value="70" required></label><label>Maximum attempts<input name="maxAttempts" type="number" min="1" value="1" required></label></div><label class="check"><input name="randomize" type="checkbox" checked> Randomize questions</label><label class="check"><input name="published" type="checkbox"> Publish exam</label><button class="btn" type="submit">Create Final Exam</button></form><div class="admin-course-list" data-list><p>Loading examinations...</p></div></section></main><script src="js/admin-exams.js"></script></body></html>
