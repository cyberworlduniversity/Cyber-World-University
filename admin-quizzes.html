<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Builder | CWU</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="admin.html"><span class="brand-mark">CWU</span><span>Quiz Builder</span></a><nav><a href="admin.html">Admin</a><a href="admin-questions.html">Question Bank</a><a href="admin-courses.html">Courses</a></nav><button class="btn btn-small" data-logout>Logout</button></header><main><section class="section admin-shell"><div class="section-heading"><p class="eyebrow">ADMIN · ASSESSMENTS</p><h1>Quiz Builder</h1><p class="hero-text">Configure quizzes using the course question bank.</p></div><div class="form-message" data-message hidden></div><form class="course-card admin-form" data-form><label>Course<select name="courseId" data-course></select></label><label>Quiz title<input name="title" required maxlength="160"></label><label>Description<textarea name="description" rows="3"></textarea></label><div class="form-grid"><label>Questions<input name="questionCount" type="number" min="1" value="10"></label><label>Time limit (minutes)<input name="timeLimitMinutes" type="number" min="1" value="10"></label><label>Pass percentage<input name="passPercent" type="number" min="1" max="100" value="70"></label><label>Maximum attempts<input name="maxAttempts" type="number" min="1" value="1"></label></div><label class="check"><input name="randomize" type="checkbox" checked> Randomize questions</label><label class="check"><input name="published" type="checkbox"> Publish quiz</label><button class="btn" type="submit">Create Quiz</button></form><div class="admin-course-list" data-list><p>Loading quizzes...</p></div></section></main><script src="js/admin-quizzes.js"></script></body></html>
