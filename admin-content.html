<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Content | CWU Admin</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="admin.html"><span class="brand-mark">CWU</span><span>Course Content</span></a><nav><a href="admin.html">Admin</a><a href="admin-courses.html">Courses</a><a href="courses.html">Public Courses</a></nav><button class="btn btn-small" data-logout>Logout</button></header><main><section class="section admin-shell"><div class="section-heading"><p class="eyebrow">ADMIN · CONTENT</p><h1>Course Phases &amp; Lessons</h1><p class="hero-text">Build the learning structure beneath each course. Publish phases and lessons when they are ready for students.</p></div><div class="form-message" data-message hidden></div><div class="course-card"><label class="content-select-label">Course<select data-course-select><option>Loading courses…</option></select></label></div><div class="content-grid"><form class="course-card admin-form" data-phase-form><h2>Add Phase</h2><label>Phase title<input name="title" required maxlength="160"></label><label>Description<textarea name="description" rows="4"></textarea></label><label>Order<input name="order" type="number" min="1" value="1"></label><label class="check"><input name="published" type="checkbox"> Publish phase</label><button class="btn" type="submit">Add Phase</button></form><form class="course-card admin-form" data-lesson-form><h2>Add Lesson</h2><label>Phase<select name="phaseId" required data-phase-select><option>Select a course first</option></select></label><label>Lesson title<input name="title" required maxlength="160"></label><label>Description<textarea name="description" rows="4"></textarea></label><label>Duration<input name="duration" placeholder="20 minutes"></label><label>Video URL<input name="videoUrl" type="url" placeholder="Optional video URL"></label><label>Video title<input name="videoTitle" maxlength="160" placeholder="Lesson video title"></label><label>Video description<textarea name="videoDescription" rows="3"></textarea></label><label>Video thumbnail URL<input name="videoThumbnail" type="url" placeholder="Optional thumbnail URL"></label><label>Video duration<input name="videoDuration" placeholder="20:00"></label><label class="check"><input name="videoPublished" type="checkbox"> Publish video</label><label>Study material URL<input name="materialUrl" type="url" placeholder="PDF/document URL"></label><label>Material title<input name="materialTitle" maxlength="160" placeholder="Notes / PDF title"></label><label>Material type<select name="materialType"><option value="PDF">PDF</option><option value="DOC">DOC/DOCX</option><option value="PPT">PPT/PPTX</option><option value="TXT">TXT</option><option value="ZIP">ZIP</option></select></label><label class="check"><input name="materialPublished" type="checkbox"> Publish material</label><label>Order<input name="order" type="number" min="1" value="1"></label><label class="check"><input name="published" type="checkbox"> Publish lesson</label><button class="btn" type="submit">Add Lesson</button></form></div><div class="admin-section-heading"><p class="eyebrow">STRUCTURE</p><h2>Current Content</h2></div><div data-content-list><p>Select a course to load content.</p></div></section></main><script src="js/admin-content.js"></script></body></html>
