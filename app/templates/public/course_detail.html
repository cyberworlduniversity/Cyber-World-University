{% extends "base.html" %}{% block content %}<main><article class="card"><h1>{{course.title}}</h1><p>{{course.description}}</p><p>Instructor: {{course.instructor}} · Level: {{course.level}} · {{course.duration}}</p>{% if current_user.is_authenticated %}<form method="post" action="{{url_for('student.enroll',course_id=course.id)}}"><button class="btn">Enroll</button></form>{% else %}<a class="btn" href="{{url_for('auth.login')}}">Login to Enroll</a>{% endif %}</article></main>{% endblock %}
