{% extends "admin/base_admin.html" %}{% block admincontent %}<h1>Question Bank</h1><form method="post" class="card"><select name="course_id">{% for c in courses %}<option value="{{c.id}}">{{c.title}}</option>{% endfor %}</select><textarea name="text" required placeholder="Question"></textarea><input name="correct_answer" required placeholder="Correct answer"><button class="btn">Add Question</button></form>{% for q in questions %}<p>{{q.text}}</p>{% endfor %}{% endblock %}
