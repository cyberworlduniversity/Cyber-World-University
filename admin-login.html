<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | Cyber World University</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="section auth-page">
<section class="auth-card">
<p class="eyebrow">CYBER WORLD UNIVERSITY</p>
<h1>Admin Panel Login</h1>
<p class="hero-text">Sign in to access the protected CWU administration area.</p>
<div class="form-message" data-admin-login-message hidden></div>
<form data-admin-login-form>
<label>Admin Username<input name="username" type="text" autocomplete="username" required></label>
<label>Admin Password<input name="password" type="password" autocomplete="current-password" required></label>
<button class="btn" type="submit">Login to Admin Panel</button>
</form>
<p><a href="index.html">← Back to website</a></p>
</section>
</main>
<script src="js/admin-login.js"></script>
</body>
</html>
