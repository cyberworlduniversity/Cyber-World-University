<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question Bank | CWU</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="admin.html"><span class="brand-mark">CWU</span><span>Question Bank</span></a><nav><a href="admin.html">Admin</a><a href="admin-courses.html">Courses</a><a href="admin-content.html">Content</a></nav><button class="btn btn-small" data-logout>Logout</button></header><main><section class="section admin-shell"><div class="section-heading"><p class="eyebrow">ADMIN · ASSESSMENTS</p><h1>Question Bank</h1><p class="hero-text">Create and organize questions for each course.</p></div><div class="form-message" data-message hidden></div><div class="course-card"><label class="content-select-label">Course<select data-course><option>Loading...</option></select></label></div><form class="course-card admin-form" data-form><h2>Add Question</h2><label>Question<textarea name="question" rows="4" required></textarea></label><label>Type<select name="type"><option value="mcq">Multiple Choice</option><option value="true_false">True / False</option></select></label><div class="form-grid"><label>Option A<input name="a"></label><label>Option B<input name="b"></label><label>Option C<input name="c"></label><label>Option D<input name="d"></label></div><label>Correct answer<select name="correct"></select></label><div class="form-grid"><label>Topic<input name="topic"></label><label>Difficulty<select name="difficulty"><option>easy</option><option selected>medium</option><option>hard</option></select></label><label>Marks<input name="marks" type="number" min="1" value="1"></label></div><label>Explanation<textarea name="explanation" rows="3"></textarea></label><label class="check"><input name="published" type="checkbox"> Publish</label><button class="btn" type="submit">Add Question</button></form><div class="course-tools"><input data-search
