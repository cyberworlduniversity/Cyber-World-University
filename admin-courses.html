<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Management | CWU Admin</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><a class="brand" href="admin.html"><span class="brand-mark">CWU</span><span>Course Management</span></a><nav><a href="admin.html">Admin Dashboard</a><a href="admin-content.html">Course Content</a><a href="courses.html">Public Courses</a></nav><button class="btn btn-small" data-admin-logout>Logout</button></header><main><section class="section admin-shell"><div class="section-heading"><p class="eyebrow">ADMIN · COURSES</p><h1>Course Management</h1><p class="hero-text">Create and publish courses that automatically appear in the public course library.</p></div><div class="form-message" data-message hidden></div><form class="course-card admin-form" data-course-form><h2>Create New Course</h2><div class="form-grid"><label>Course name<input name="title" required maxlength="160"></label><label>Category<select name="category"><option>Cyber Security Fundamentals</option><option>Ethical Hacking</option><option>Network Security</option><option>Web Application Security</option><option>Python for Cybersecurity</option><option>Digital Forensics</option><option>Malware Analysis</option><option>Cloud Security</option><option>Penetration Testing</option><option>Bug Bounty</option><option>Linux for Cybersecurity</option><option>Cyber Defense</option></select></label><label>Level<select name="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label><label>Instructor<input name="instructor"></label><label>Duration<input name="duration" placeholder="8 weeks"></label><label>Price<input name="price" type="number" min="0" step="0.01" value="0"></label><label class="full">Thumbnail URL<input name="thumbnail" type="url" placeholder="https://..."></label><label class="full">Description<textarea name="description" rows="4" required></textarea></label><label class="full">Learning objectives<textarea name="objectives" rows="3" placeholder="One objective per line"></textarea></label><label class="full">Requirements<textarea name="requirements" rows="3" placeholder="One requirement per line"></textarea></label><label>Status<select name="status"><option value="draft">Draft</option><option value="published">Published</option></select></label></div><label class="check"><input name="isFree" type="checkbox" checked> Free course</label><button class="btn" type="submit">Create Course</button></form><div class="admin-section-heading"><p class="eyebrow">COURSE LIBRARY</p><h2>Existing Courses</h2></div><div class="admin-course-list" data-course-list><p>Loading courses…</p></div></section></main><script src="js/admin-courses.js"></script></body></html>
